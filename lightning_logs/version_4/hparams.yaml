_meta_: {}
project: /mnt/local/data5/hbakhtiar/testing/AdaptFM/AdaptFM
_requires_:
- $import monai
- $import torch
args:
  validate:
    ckpt_path: $f"{@vars::save_dir}/best.ckpt"
  test:
    ckpt_path: $f"{@vars::save_dir}/best.ckpt"
  predict:
    ckpt_path: $f"{@vars::save_dir}/best.ckpt"
vars:
  batch_size: 2
  init_LR: 0.0002
  num_workers: 8
  dataset_dir: '{''csv_path'': PosixPath(''/mnt/local/data5/hbakhtiar/imageTBAD/CTFM_training_out/dataset.csv''),
    ''dataset_dir'': PosixPath(''/mnt/local/data5/hbakhtiar/imageTBAD/CTFM_training'')}'
  cache_dir: /mnt/local/data5/hbakhtiar/testing/AdaptFM/cache_dir
  save_dir: /mnt/local/data5/hbakhtiar/imageTBAD/CTFM_training_out
  out_channels: 2
  pin_memory: true
  in_channels: 1
  patch_size:
  - 96
  - 160
  - 160
  val_max_patch_size:
  - 192
  - 240
  - 240
  axcodes: SPL
  intensity_range:
  - -1024
  - 2048
  percentage: 100
  name: ctfm_finetune
  project: /mnt/local/data5/hbakhtiar/testing/AdaptFM/AdaptFM
  wandb_group: finetune
  group: v2
  format: lighter
trainer:
  _target_: pytorch_lightning.Trainer
  max_epochs: 300
  callbacks:
  - _target_: lighter.callbacks.Freezer
    name_starts_with:
    - None
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: '@vars::save_dir'
    save_last: false
    monitor: val/metrics/Macro_Dice/epoch
    mode: max
    filename: best
    auto_insert_metric_name: false
    verbose: true
    every_n_epochs: 5
  - _target_: AdaptFM.model.foundation_models.ctfm.training_utils.ModeFixer
system:
  _target_: lighter.System
  model:
    _target_: AdaptFM.model.foundation_models.ctfm.training_utils.load_ct_fm_segresnet
    out_channels: 2
  criterion:
    _target_: monai.losses.DiceCELoss
    softmax: true
    to_onehot_y: true
    include_background: true
    squared_pred: true
    smooth_nr: 0
    smooth_dr: 1.0e-05
  optimizer:
    _target_: AdaptFM.model.foundation_models.ctfm.training_utils.build_adamw
    model: '@system::model'
    lr: '@vars::init_LR'
    weight_decay: 1.0e-05
  scheduler:
    _target_: monai.optimizers.WarmupCosineSchedule
    optimizer: '@system::optimizer'
    warmup_steps: $@trainer::max_epochs/100
    end_lr: $@system::optimizer::lr * 0.01
    warmup_multiplier: 0.1
    t_total: '@trainer::max_epochs'
  metrics:
    train:
      Macro_Dice:
        _target_: AdaptFM.model.foundation_models.ctfm.training_utils.DiceScore
        include_background: false
        per_class: false
      Classwise_Dice:
        _target_: torchmetrics.wrappers.ClasswiseWrapper
        metric:
          _target_: AdaptFM.model.foundation_models.ctfm.training_utils.DiceScore
          include_background: true
          per_class: true
        labels:
        - class_1
    val:
      Macro_Dice:
        _target_: AdaptFM.model.foundation_models.ctfm.training_utils.DiceScore
        include_background: false
        per_class: false
      Classwise_Dice:
        _target_: torchmetrics.wrappers.ClasswiseWrapper
        metric:
          _target_: AdaptFM.model.foundation_models.ctfm.training_utils.DiceScore
          include_background: true
          per_class: true
        labels:
        - class_1
  dataloaders:
    train:
      _target_: torch.utils.data.DataLoader
      batch_size: 2
      pin_memory: true
      num_workers: 8
      dataset:
        _target_: monai.data.Dataset
        data:
          _target_: AdaptFM.model.foundation_models.ctfm.training_utils.get_adaptfm_datalist
          csv_file: /mnt/local/data5/hbakhtiar/imageTBAD/CTFM_training_out/dataset.csv
          split: train
        transform:
          _target_: monai.transforms.Compose
          map_items: false
          transforms:
          - _target_: monai.transforms.LoadImaged
            keys:
            - image
            - label
            reader: ITKReader
            ensure_channel_first: true
          - _target_: monai.transforms.EnsureTyped
            keys:
            - image
            - label
          - _target_: monai.transforms.Orientationd
            keys:
            - image
            - label
            axcodes: '@vars::axcodes'
          - _target_: monai.transforms.LabelFilterd
            keys: label
            applied_labels:
            - 0
            - 1
          - _target_: monai.transforms.MapLabelValued
            keys: label
            orig_labels:
            - 0
            - 1
            target_labels:
            - 0
            - 1
          - _target_: monai.transforms.ScaleIntensityRanged
            keys: image
            a_min: $@vars::intensity_range[0]
            a_max: $@vars::intensity_range[1]
            b_min: 0
            b_max: 1
            clip: true
          - _target_: monai.transforms.CropForegroundd
            keys:
            - image
            - label
            source_key: image
            margin: 10
          - _target_: monai.transforms.SpatialPadd
            keys:
            - image
            - label
            spatial_size: '@vars::patch_size'
            mode: constant
          - _target_: monai.transforms.RandCropByLabelClassesd
            keys:
            - image
            - label
            label_key: label
            image_key: image
            ratios: $[0] + [1]*(@vars::out_channels-1)
            num_classes: '@vars::out_channels'
            num_samples: 1
            spatial_size: '@vars::patch_size'
            warn: false
          - _target_: monai.transforms.Lambda
            func: '$lambda x: x[0]'
            track_meta: false
          - _target_: monai.transforms.RandAffined
            keys:
            - image
            - label
            mode:
            - bilinear
            - nearest
            prob: 0.2
            rotate_range:
            - 0.26
            - 0.26
            - 0.26
            scale_range:
            - 0.2
            - 0.2
            - 0.2
            cache_grid: true
            padding_mode: constant
          - _target_: monai.transforms.RandGaussianSmoothd
            keys: image
            prob: 0.2
            sigma_x:
            - 0.5
            - 1.0
            sigma_y:
            - 0.5
            - 1.0
            sigma_z:
            - 0.5
            - 1.0
          - _target_: monai.transforms.RandScaleIntensityd
            keys: image
            factors: 0.3
            prob: 0.5
          - _target_: monai.transforms.RandShiftIntensityd
            keys: image
            offsets: 0.1
            prob: 0.5
          - _target_: monai.transforms.RandGaussianNoised
            keys: image
            std: 0.1
            prob: 0.2
          - _target_: monai.transforms.Lambda
            func: '$lambda x: {''input'': x[''image''].as_tensor().contiguous(), ''target'':
              x[''label''].as_tensor().contiguous(), ''id'': x[''id'']}'
            track_meta: false
    val:
      _target_: torch.utils.data.DataLoader
      batch_size: 1
      pin_memory: true
      num_workers: 8
      dataset:
        _target_: monai.data.Dataset
        data:
          _target_: AdaptFM.model.foundation_models.ctfm.training_utils.get_adaptfm_datalist
          csv_file: /mnt/local/data5/hbakhtiar/imageTBAD/CTFM_training_out/dataset.csv
          split: val
        transform:
          _target_: monai.transforms.Compose
          map_items: false
          transforms:
          - _target_: monai.transforms.LoadImaged
            keys:
            - image
            - label
            reader: ITKReader
            ensure_channel_first: true
          - _target_: monai.transforms.EnsureTyped
            keys:
            - image
            - label
          - _target_: monai.transforms.Orientationd
            keys:
            - image
            - label
            axcodes: '@vars::axcodes'
          - _target_: monai.transforms.LabelFilterd
            keys: label
            applied_labels:
            - 0
            - 1
          - _target_: monai.transforms.MapLabelValued
            keys: label
            orig_labels:
            - 0
            - 1
            target_labels:
            - 0
            - 1
          - _target_: monai.transforms.ScaleIntensityRanged
            keys: image
            a_min: $@vars::intensity_range[0]
            a_max: $@vars::intensity_range[1]
            b_min: 0
            b_max: 1
            clip: true
          - _target_: monai.transforms.CropForegroundd
            keys:
            - image
            - label
            source_key: image
            margin: 10
          - _target_: monai.transforms.RandSpatialCropd
            keys:
            - image
            - label
            roi_size: '@vars::val_max_patch_size'
            random_size: false
          - _target_: monai.transforms.SpatialPadd
            keys:
            - image
            - label
            spatial_size: '@vars::val_max_patch_size'
            mode: constant
          - _target_: monai.transforms.Lambda
            func: '$lambda x: {''input'': x[''image''].as_tensor().contiguous(), ''target'':
              x[''label''].as_tensor().contiguous(), ''id'': x[''id'']}'
            track_meta: false
  adapters:
    train:
      batch:
        _target_: lighter.adapters.BatchAdapter
        input_accessor: input
        target_accessor: target
        identifier_accessor: id
      metrics:
        _target_: lighter.adapters.MetricsAdapter
        pred_argument: 0
        target_argument: 1
        pred_transforms:
        - '$lambda x: torch.softmax(x, 1)'
        target_transforms:
        - '$lambda x: x.squeeze(1).long()'
      logging:
        _target_: lighter.adapters.LoggingAdapter
        pred_transforms:
        - '$lambda x: torch.softmax(x, 1)'
        - '$lambda x: x.argmax(dim=1, keepdim=True)'
    val:
      batch:
        _target_: lighter.adapters.BatchAdapter
        input_accessor: input
        target_accessor: target
        identifier_accessor: id
      metrics:
        _target_: lighter.adapters.MetricsAdapter
        pred_argument: 0
        target_argument: 1
        pred_transforms:
        - '$lambda x: torch.softmax(x, 1)'
        target_transforms:
        - '$lambda x: x.squeeze(1).long()'
      logging:
        _target_: lighter.adapters.LoggingAdapter
        pred_transforms:
        - '$lambda x: torch.softmax(x, 1)'
        - '$lambda x: x.argmax(dim=1, keepdim=True)'
  inferer:
    _target_: monai.inferers.SlidingWindowInfererAdapt
    roi_size: '@vars::patch_size'
    sw_batch_size: 2
    overlap: 0.625
    mode: gaussian
